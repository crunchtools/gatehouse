# Adopters call the reusable workflows at the major tag (`@v0`); this moves it.
# The fleet's ci.yml tags and releases but does not move major tags.
name: Major tag

on:
  # CI's promote job moves quay.io/crunchtools/gatehouse:latest, which review.yml
  # runs by default, after its write job has already pushed the release tag. A
  # tag-push trigger would race promote; a completed CI run on master has not.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  # Forward only: a late patch to an older minor leaves the tag alone. To undo a
  # release, move the tag back by hand (README, "Versions").
  major-tag:
    name: Move the major tag
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: major-tag
      cancel-in-progress: false
    steps:
      - name: Move the tag
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          release='^v[0-9]+\.[0-9]+\.[0-9]+$'
          refs="repos/$GITHUB_REPOSITORY/git"
          # The release tag on the commit CI just promoted, if this push was one.
          TAG=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" \
            -q '.[] | select(.commit.sha == env.SHA) | .name' | grep -E "$release" | sort -V | tail -n 1 || true)
          if [ -z "$TAG" ]; then
            echo "${SHA:0:7} carries no release tag; no major tag moves."
            exit 0
          fi
          major="${TAG%%.*}"
          # One listing answers both questions: v0 itself and every v0.x.y.
          tags=$(gh api --paginate "$refs/matching-refs/tags/$major" -q '.[].ref' | sed 's|^refs/tags/||')
          newest=$(grep -E "$release" <<<"$tags" | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is older than $newest; $major stays where it is."
            exit 0
          fi
          if grep -qx "$major" <<<"$tags"; then
            gh api -X PATCH "$refs/refs/tags/$major" -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "$refs/refs" -f ref="refs/tags/$major" -f sha="$SHA" --silent
          fi
          echo "$major now points at $TAG (${SHA:0:7})."
