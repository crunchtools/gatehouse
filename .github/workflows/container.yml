name: Container Build & Push

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]  # a release, not the major tag this workflow moves
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/gatehouse
  GHCR_IMAGE: ghcr.io/crunchtools/gatehouse

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.QUAY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.QUAY_IMAGE }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Adopters call the reusable workflows at the major tag (`@v0`). Moving it is
  # what delivers a release, so it happens here, after both images exist:
  # review.yml at the new tag runs the new image by default. Forward only: a
  # late patch to an older minor leaves the tag alone. To undo a release, move
  # the tag back by hand (README, "Versions").
  major-tag:
    name: Move the major tag
    needs: [build-and-push-quay, build-and-push-ghcr]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: major-tag
      cancel-in-progress: false
    steps:
      - name: Move the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$TAG" =~ $release ]]; then
            echo "$TAG is not a release tag; no major tag moves."
            exit 0
          fi
          major="${TAG%%.*}"
          refs="repos/$GITHUB_REPOSITORY/git"
          # One listing answers both questions: v0 itself and every v0.x.y.
          tags=$(gh api --paginate "$refs/matching-refs/tags/$major" -q '.[].ref' | sed 's|^refs/tags/||')
          newest=$(grep -E "$release" <<<"$tags" | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is older than $newest; $major stays where it is."
            exit 0
          fi
          if grep -qx "$major" <<<"$tags"; then
            gh api -X PATCH "$refs/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api -X POST "$refs/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" --silent
          fi
          echo "$major now points at $TAG (${GITHUB_SHA:0:7})."

  # python-sdlc BAKES this image's venv (`COPY --from=gatehouse /app/venv`), so
  # a release here that nobody told it about leaves 35 Python repos reviewing
  # their push tier with the previous Gatehouse while CI's reusable `review.yml`
  # runs this one. Local and CI then disagree on the same diff -- the failure
  # python-sdlc exists to remove, and the one that matters most for THIS image,
  # because 0.22.0's consensus voting changes what a finding even is.
  #
  # Constitution XII (v1.30.0) states it as a rule, and the Container Image
  # profile already required it of any image others build FROM. After the major
  # tag moves, so the rebuild sees a registry and a tag that have both settled.
  #
  # Tags only, not every push to master. A release pushes master and then the
  # tag, and both were 'push', so each release dispatched twice: on 2026-11-07
  # the two runs landed 15 seconds apart, both computed python-sdlc 0.5.2, and
  # the second failed pushing a branch the first had already created. The pin
  # downstream can only move to a RELEASED tag -- update_tools.py reads the
  # highest release tag, never master -- so a dispatch on a master push had
  # nothing it could move and only raced the one that did.
  dispatch-downstream:
    name: Tell the SDLC images to rebuild
    needs: [build-and-push-quay, build-and-push-ghcr]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The crunchtools-ci App's token, not a personal one: it has its own rate
      # limit, so a throttled account can't stop this step.
      - name: Mint CI token
        id: ci-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRUNCHTOOLS_CI_CLIENT_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools

      # `|| echo` rather than a hard failure: the image is already published and
      # correct by here, so a rebuild nobody could be told about is a warning to
      # act on, not a reason to fail a release that succeeded.
      - name: Trigger downstream rebuilds
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          for repo in python-sdlc; do
            gh api repos/crunchtools/$repo/dispatches \
              -f event_type=parent-image-updated \
              || echo "::warning::$repo was not told to rebuild; start its build by hand"
          done
