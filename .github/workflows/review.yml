# Gatehouse — fork-safe PR review (reusable workflow)
#
# Hardened `pull_request_target` review: diff-piped, NO checkout, scoped-secret-bound.
# Reviews fork PRs with a bring-your-own OpenRouter key and zero hosting. Safe by
# construction: the fork's code is only ever read as a unified DIFF on stdin —
# never checked out to disk, never executed. The container runs `gatehouse`,
# which is diff-in -> OpenRouter -> PR-review-comments-out.
#
# ── How adopters use it ──────────────────────────────────────────────────────
# Add `.github/workflows/gatehouse.yml` to your repository:
#
#   name: Gatehouse Review
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened]
#   permissions: {}                 # default-deny at the top level
#   jobs:
#     review:
#       permissions:                # grant ONLY what the review needs
#         contents: read
#         pull-requests: write
#       uses: crunchtools/gatehouse/.github/workflows/review.yml@v0.16.0
#       secrets:
#         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
#
# ── Scoped secret (recommended) ──────────────────────────────────────────────
# Configure OPENROUTER_API_KEY as a *scoped* secret bound to this trusted reusable
# workflow (Settings -> Secrets and variables -> Actions -> scope to
# `crunchtools/gatehouse/.github/workflows/review.yml`). Then no other job in the
# caller's repo can read the key — closing the "extra job under pull_request_target"
# footgun. (GitHub 2026 Actions roadmap; verify availability for your plan.)
#
# ── Why this is safe under pull_request_target ───────────────────────────────
#   1. No `actions/checkout` of the fork head — nothing on disk to execute.
#      (Also sidesteps the actions/checkout v7 fork-head block entirely.)
#   2. The diff arrives as data on stdin; `gatehouse --stdin` never runs `git`
#      against, builds, installs, or executes the PR.
#   3. The image is pinned to a release tag; the run step invokes only the container
#      entrypoint — no repo-defined tooling runs.
#   4. Least-privilege GITHUB_TOKEN: contents:read + pull-requests:write.
# -----------------------------------------------------------------------------

name: Gatehouse Review (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: "OpenRouter model slug override (default: gatehouse built-in)"
        type: string
        required: false
        default: ""
      agents:
        description: "Comma-separated agent slugs (default: all agents)"
        type: string
        required: false
        default: ""
      required_low_agents:
        # Keep in step with triage.yml's input of the same name: LOWs from
        # these agents skip the advisory cap, so triage sees all it requires.
        description: "Comma-separated agent names whose LOW findings are never capped."
        type: string
        required: false
        default: "Bug Hunter,Security Scan"
      blocking:
        # Advisory by default: the review posts findings as PR comments and no
        # finding fails the check, so a non-deterministic LLM finding can never
        # block a merge. It fails only when the review did not happen: fewer
        # than half of the agents finished, or the reviewer could not run. Opt in with `blocking: true` only if you want
        # critical/high findings from blocking agents to fail the check. Even
        # then, do NOT mark this a *required* status check — see examples/.
        description: "Fail the check on blocking findings (default: advisory)."
        type: boolean
        required: false
        default: false
      image:
        # Pinned to the immutable release TAG, not a digest: our registry prunes
        # untagged manifests on rebuild, so a digest pin dies the next time the
        # tag is rebuilt. The release tag is controlled and not rebuilt casually.
        description: "Gatehouse release image tag. Bump per release."
        type: string
        required: false
        default: "quay.io/crunchtools/gatehouse:0.16.0"
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    name: Gatehouse Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read          # read PR metadata / diff via the API
      pull-requests: write    # post the review (REQUEST_CHANGES / COMMENT)
    steps:
      - name: Review fork diff (no checkout, never executes PR code)
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Trusted base repo + base-branch SHA — styleguide/constitution are
          # loaded from HERE via the API, never from the fork head.
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          # The commit under review. On a push (synchronize) gatehouse reviews
          # only the commits since its last complete review, fetched over the
          # compare API; it pins the posted review to this SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          IMAGE: ${{ inputs.image }}
          MODEL: ${{ inputs.model }}
          AGENTS: ${{ inputs.agents }}
          BLOCKING: ${{ inputs.blocking }}
          REQUIRED_LOW_AGENTS: ${{ inputs.required_low_agents }}
        run: |
          set -euo pipefail

          # This reusable workflow only makes sense under pull_request_target,
          # where a fork PR's GITHUB_TOKEN/secrets are available in the BASE
          # repo's trusted context. Fail loudly if there is no PR context.
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::No pull_request context. Call this from 'on: pull_request_target'." >&2
            exit 1
          fi

          # A review that cannot run still posts one, marked failed, so the
          # triage check holds the PR open instead of passing on "no
          # findings" (#75, #77). The marker is github.py's REVIEW_FAILED_MARKER.
          fail_review() {
            echo "::error::Gatehouse could not review PR #${PR_NUMBER}: $1" >&2
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --silent \
              -f event=COMMENT -f commit_id="$HEAD_SHA" \
              -f body="Gatehouse could not review this PR: $1"$'\n\n''<!-- gatehouse review failed -->' \
              || echo "::warning::Could not post the failed review." >&2
            exit 2
          }
          [ -n "${OPENROUTER_API_KEY:-}" ] || fail_review "no OPENROUTER_API_KEY reached this run."

          # Optional passthrough flags (only added when provided).
          # Advisory by default: unless the caller sets `blocking: true`, add
          # --advisory so gatehouse exits 0 regardless of findings. The review
          # is still posted; no finding fails the check.
          args=( --stdin --comment --required-low-agents "$REQUIRED_LOW_AGENTS" )
          [ "$BLOCKING" = "true" ] || args+=( --advisory )
          [ "$ACTION" = "synchronize" ] && args+=( --incremental )
          [ -n "$MODEL" ]  && args+=( --model "$MODEL" )
          [ -n "$AGENTS" ] && args+=( --agents "$AGENTS" )

          # 1) Fetch the PR diff over the API — data only, no fork code on disk.
          #    Staged in a file so a failed fetch fails here, by name, instead
          #    of reaching gatehouse as an empty diff. --allow-escape-sequences:
          #    gh otherwise refuses any diff containing ESC bytes (data files,
          #    terminal fixtures); the diff goes to a pipe, not a terminal, and
          #    gatehouse strips escapes from everything it prints or posts.
          diff_file="$(mktemp)"
          files_file="$(mktemp)"
          # Container root cannot write the runner's $GITHUB_STEP_SUMMARY
          # (EACCES, #61), so gatehouse writes into a scratch dir and the host
          # appends it after the run.
          out_dir="$(mktemp -d)"
          chmod 0777 "$out_dir"
          trap 'rm -rf "$diff_file" "$files_file" "$out_dir"' EXIT
          if ! gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --patch \
              --allow-escape-sequences > "$diff_file"; then
            # The diff endpoint refuses a PR of more than 300 files (HTTP 406,
            # #75). The files endpoint pages through up to 3000, each with its
            # own patch: still data only, still nothing checked out.
            echo "::warning::Could not fetch the PR diff; rebuilding it from the PR's file list."
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              > "$files_file" || fail_review "its diff could not be fetched."

            # --- files to diff (tests/test_files_diff.py runs this against fixtures) ---
            jq -rs '
              (add // [])[]
              | (.previous_filename // .filename) as $old
              | "diff --git a/\($old) b/\(.filename)",
                (if .status == "added" then "new file mode 100644"
                 elif .status == "removed" then "deleted file mode 100644"
                 elif .status == "renamed" then "rename from \($old)", "rename to \(.filename)"
                 else empty end),
                (select(.patch != null)
                 | (if .status == "added" then "--- /dev/null" else "--- a/\($old)" end),
                   (if .status == "removed" then "+++ /dev/null" else "+++ b/\(.filename)" end),
                   .patch)
            ' "$files_file" > "$diff_file" || fail_review "its diff could not be rebuilt."
            # --- end files to diff ---

            listed="$(jq -s 'add // [] | length' "$files_file")" \
              || fail_review "its file list could not be read."
            changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .changed_files)" \
              || fail_review "its file count could not be fetched."
            if [ "$listed" -lt "$changed" ]; then
              fail_review "it changes ${changed} files and the API lists only ${listed}."
            fi
            unpatched="$(jq -s '[(add // [])[] | select(.patch == null)] | length' "$files_file")" \
              || unpatched=0
            if [ "$unpatched" -gt 0 ]; then
              echo "::warning::${unpatched} file(s) carry no patch (binary, too large, or renamed unchanged) and were not reviewed."
            fi
          fi

          # 2) Feed it to the release-tag-pinned container's `gatehouse --stdin --comment`.
          #    - GITHUB_REF is synthesized as refs/pull/N/merge so gatehouse's
          #      detect_pr_context() resolves (repo, PR) without mounting the event file.
          #    - GITHUB_TOKEN authorizes gatehouse to POST the PR review via the REST API.
          #    - gatehouse appends its per-agent model/token/cost table to
          #      out_dir; the host copies it into the step summary.
          rc=0
          docker run --rm -i \
            -e OPENROUTER_API_KEY \
            -e GITHUB_TOKEN="$GH_TOKEN" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_REF="refs/pull/${PR_NUMBER}/merge" \
            -e GATEHOUSE_CONTEXT_REPO="$GITHUB_REPOSITORY" \
            -e GATEHOUSE_CONTEXT_REF="$BASE_REF" \
            -e GATEHOUSE_HEAD_SHA="$HEAD_SHA" \
            -v "$out_dir:/out" \
            -e GITHUB_STEP_SUMMARY=/out/step-summary.md \
            "$IMAGE" \
            "${args[@]}" < "$diff_file" || rc=$?
          if [ -s "$out_dir/step-summary.md" ]; then
            cat "$out_dir/step-summary.md" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::Could not append Gatehouse usage to the step summary."
          fi
          # 125-127 is docker failing to run the image, not gatehouse's verdict.
          if [ "$rc" -ge 125 ]; then
            fail_review "the reviewer image could not be run (exit ${rc})."
          fi
          exit "$rc"
