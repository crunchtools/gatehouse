# Gatehouse — fork-safe PR review (reusable workflow)
#
# Hardened `pull_request_target` review: diff-piped, NO checkout, scoped-secret-bound.
# Reviews fork PRs with a bring-your-own OpenRouter key and zero hosting. Safe by
# construction: the fork's code is only ever read as a unified DIFF on stdin —
# never checked out to disk, never executed. The container runs `gatehouse`,
# which is diff-in -> OpenRouter -> PR-review-comments-out.
#
# ── How adopters use it ──────────────────────────────────────────────────────
# Add `.github/workflows/gatehouse.yml` to your repository:
#
#   name: Gatehouse Review
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened]
#   permissions: {}                 # default-deny at the top level
#   jobs:
#     review:
#       permissions:                # grant ONLY what the review needs
#         contents: read
#         pull-requests: write
#       uses: crunchtools/gatehouse/.github/workflows/review.yml@v0
#       secrets:
#         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
#
# ── Scoped secret (recommended) ──────────────────────────────────────────────
# Configure OPENROUTER_API_KEY as a *scoped* secret bound to this trusted reusable
# workflow (Settings -> Secrets and variables -> Actions -> scope to
# `crunchtools/gatehouse/.github/workflows/review.yml`). Then no other job in the
# caller's repo can read the key — closing the "extra job under pull_request_target"
# footgun. (GitHub 2026 Actions roadmap; verify availability for your plan.)
#
# ── Why this is safe under pull_request_target ───────────────────────────────
#   1. No `actions/checkout` of the fork head — nothing on disk to execute.
#      (Also sidesteps the actions/checkout v7 fork-head block entirely.)
#   2. The diff arrives as data on stdin; `gatehouse --stdin` never runs `git`
#      against, builds, installs, or executes the PR.
#   3. The image is quay.io/crunchtools/gatehouse:latest, which only a
#      Gatehouse release moves (constitution XV rule 5), pulled fresh each run;
#      the run step invokes only the container entrypoint — no repo-defined
#      tooling runs.
#   4. Least-privilege GITHUB_TOKEN: contents:read + pull-requests:write.
# -----------------------------------------------------------------------------

name: Gatehouse Review (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: "OpenRouter model slug override (default: gatehouse built-in)"
        type: string
        required: false
        default: ""
      agents:
        description: "Comma-separated agent slugs (default: all agents)"
        type: string
        required: false
        default: ""
      required_low_agents:
        # Keep in step with triage.yml's input of the same name: LOWs from
        # these agents skip the advisory cap, so triage sees all it requires.
        description: "Comma-separated agent names whose LOW findings are never capped."
        type: string
        required: false
        default: "Bug Hunter,Security Scan"
      blocking:
        # Advisory by default: the review posts findings as PR comments and no
        # finding fails the check, so a non-deterministic LLM finding can never
        # block a merge. It fails only when the review did not happen: fewer
        # than half of the agents finished, or the reviewer could not run. Opt in with `blocking: true` only if you want
        # critical/high findings from blocking agents to fail the check. Even
        # then, do NOT mark this a *required* status check — see examples/.
        description: "Fail the check on blocking findings (default: advisory)."
        type: boolean
        required: false
        default: false
      max_diff_bytes:
        # Passed to the reviewer as GATEHOUSE_MAX_DIFF_BYTES. A diff still over
        # it once large deletions are elided is refused before any model call,
        # with a review marked failed. Empty keeps the 1 MiB default.
        description: "Largest diff, in bytes, sent for review (default: 1 MiB)."
        type: string
        required: false
        default: ""
      image:
        # Empty means quay.io/crunchtools/gatehouse:latest: crunchtools tool
        # images float at the tag each release moves (constitution XV rule 5),
        # so nothing here is bumped by hand and no caller reviews with a stale
        # reviewer. A digest pin would also die: our registry prunes untagged
        # manifests on rebuild.
        description: "Gatehouse image override; empty runs the latest release"
        type: string
        required: false
        default: ""
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    name: Gatehouse Code Review
    # Private repos only, on our uncached runner when the organization names
    # it: a public repo's hosted minutes are free, so routing it here would buy
    # nothing and only widen what a fork could reach. For a private repo, every
    # event, pull_request_target and forks included: this job executes no pull
    # request code under any of them (no checkout; the diff is piped to the reviewer image, never run), so the
    # fork-and-Dependabot split the build jobs need (constitution#160) has
    # nothing to protect here. Uncached, never cached: that runner starts every
    # job from empty storage, so nothing one job sees reaches the next.
    # Public repos, and every repo when UNCACHED_RUNNER_LABEL is cleared, run
    # on GitHub's machines.
    runs-on: ${{ github.event.repository.private && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read          # read PR metadata / diff via the API
      pull-requests: write    # post the review (REQUEST_CHANGES / COMMENT)
    steps:
      - name: Review fork diff (no checkout, never executes PR code)
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Trusted base repo + base-branch SHA — styleguide/constitution are
          # loaded from HERE via the API, never from the fork head.
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          # The commit under review. On a push (synchronize) gatehouse reviews
          # only the commits since its last complete review, fetched over the
          # compare API; it pins the posted review to this SHA.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          IMAGE: ${{ inputs.image }}
          LATEST_IMAGE: quay.io/crunchtools/gatehouse:latest
          MODEL: ${{ inputs.model }}
          AGENTS: ${{ inputs.agents }}
          BLOCKING: ${{ inputs.blocking }}
          REQUIRED_LOW_AGENTS: ${{ inputs.required_low_agents }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Which repository the head belongs to: the same as GITHUB_REPOSITORY
          # for a branch here, a fork's own full name otherwise. Used to skip
          # Ashigaru's release PRs, and passed to gatehouse, which reads
          # gatehouse-findings.toml from the head only when they match — a fork
          # must not be able to suppress the findings on its own pull request.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # This reusable workflow only makes sense under pull_request_target,
          # where a fork PR's GITHUB_TOKEN/secrets are available in the BASE
          # repo's trusted context. Fail loudly if there is no PR context.
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::No pull_request context. Call this from 'on: pull_request_target'." >&2
            exit 1
          fi

          # Three kinds of PR skip the LLM review: no finding on them has ever
          # been worth its cost (a155: half of a day's 294 reviews were
          # these). A skip posts nothing a reviewer must answer, so the
          # review job and `Gatehouse triage` stay green; each one says why
          # in the step summary, and the last two in a review on the PR.
          # Every lookup that fails falls through to the review.
          # --- skips (tests/test_release_skip.py runs this) ---
          # 1) An Ashigaru release PR only moves the changelog and the version
          #    strings, and the constitution validator checks those (v1.28.0).
          #    Nobody reads a review there, so one unanswered finding held
          #    mcp-metsuke 3.5.0 for four days. Skipped, it posts nothing and
          #    triage passes. All three must hold: the app's own branch, in
          #    this repository, opened by the app.
          if [[ "$HEAD_REF" == ashigaru/release-* ]] \
              && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
              && [ "$PR_AUTHOR" = "ashigaru-crunchtools[bot]" ]; then
            echo "Ashigaru release PR; not reviewed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A skip leaves a review of its own, from this job's token: its
          # body starts "Gatehouse" so triage reads it as the newest review
          # (clearing a failed one), and it carries no finding. Both skips
          # read the earlier reviews; without them, the PR is reviewed.
          REVIEWER="github-actions[bot]"
          post_skip() {
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --silent \
                -f event=COMMENT -f commit_id="$HEAD_SHA" -f body="$1"; then
              echo "${1%%$'\n'*} No model was called." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Could not post the skip; reviewing instead." >&2
          }
          skip_reviews="$(mktemp)"
          reviews_read=0
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "$skip_reviews" 2>/dev/null && reviews_read=1 \
            || echo "::notice::Could not read the earlier reviews; not skipping." >&2

          # 2) A bot we own (Dependabot, crunchtools-ci, Ashigaru) bumping
          #    the refs of actions in workflows, and nothing else. Every
          #    changed line is a `uses:` line and the same actions come out
          #    as went in. Any other file, dependency manifests and
          #    Containerfiles included, is reviewed: a new dependency, hook
          #    or base image is not a pin, and anyone with write access can
          #    push to a bot's branch. Both sides of a rename must be a
          #    workflow, the API must list every changed file, and the head
          #    must be in this repository: a fork is always reviewed. The
          #    file list is read over the API; nothing is checked out.
          case "$PR_AUTHOR" in
            "dependabot[bot]"|"crunchtools-ci[bot]"|"ashigaru-crunchtools[bot]") owned_bot=1 ;;
            *) owned_bot=0 ;;
          esac
          pin_files="$(mktemp)"
          if [ "$reviews_read" = 1 ] && [ "$owned_bot" = 1 ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
              && gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
                > "$pin_files" \
              && pr_changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .changed_files)" \
              && jq -se --argjson changed "$pr_changed" '
                def actions($sign):
                  [ .patch | split("\n")[] | select(startswith($sign))
                    | capture("uses:\\s*(?<a>[^\\s@]+)@").a ] | sort;
                (add // []) as $files
                | ($files | length) == $changed and $changed > 0
                and all($files[] | .filename, (.previous_filename // empty);
                  test("^\\.github/workflows/[^/]+\\.yml$"))
                and all($files[];
                  (.patch // null) != null
                  and all(.patch | split("\n")[] | select(test("^[-+]"));
                    test("^[-+]\\s*(-\\s+)?uses:\\s*[^\\s]+@[^\\s]+(\\s+#.*)?$"))
                  and actions("+") == actions("-"))
              ' "$pin_files" > /dev/null; then
            # One review says so per head, not one per re-run: triage holds
            # while the newest review is on an older head.
            if jq -se --arg bot "$REVIEWER" --arg head "$HEAD_SHA" '
                [ (add // [])[] | select(.user.login == $bot and ((.body // "") | startswith("Gatehouse"))) ]
                | last | ((.body // "") | contains("<!-- gatehouse skipped: pins -->"))
                  and ((.commit_id // "") | ascii_downcase) == ($head | ascii_downcase)
              ' "$skip_reviews" > /dev/null; then
              echo "Bot PR moving only action refs; not reviewed. No model was called." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            post_skip "Gatehouse skipped this review: ${PR_AUTHOR} only moves the refs of the actions its workflows use."$'\n\n''<!-- gatehouse skipped: pins -->'
          fi

          # 3) A head whose patch Gatehouse already reviewed: a rebase, or a
          #    re-push of the same change. `git patch-id --verbatim` (which
          #    implies --stable) of the base...head diff ignores line offsets
          #    and file order, so the same change on a newer base matches; it
          #    keeps whitespace, so a re-indent is not the same patch. The
          #    earlier heads are the newest five with a complete Gatehouse
          #    review, diffed against the same base. The skip lists the
          #    matched head's commits that the new head lacks (what a rebase
          #    orphans) in `<!-- gatehouse carried <sha>... -->`: triage
          #    counts them as on the PR, so the findings written on them,
          #    and the `fixed in` answers naming them, carry forward instead
          #    of being dropped as orphans or raised again. Listing them here,
          #    once, spares triage a lookup per skipped rebase on every run.
          patch_id_of() {
            gh api -H 'Accept: application/vnd.github.diff' \
              "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...$1" 2>/dev/null \
              | git patch-id --verbatim | cut -d' ' -f1
          }
          if [ "$reviews_read" = 1 ]; then
            jq -rs --arg bot "$REVIEWER" '
              [ (add // [])[]
                | select(.user.login == $bot and ((.body // "") | startswith("Gatehouse"))
                    and ((.body // "") | contains("<!-- gatehouse review complete -->"))
                    and ((.body // "") | contains("<!-- gatehouse review failed -->") | not))
                | {sha: (.commit_id // ""), url: (.html_url // "")}
                | select(.sha | test("^[0-9a-f]{40}$")) ]
              | reverse
              | reduce .[] as $r ([]; if any(.[]; .sha == $r.sha) then . else . + [$r] end)
              | .[:5][] | "\(.sha) \(.url)"
            ' "$skip_reviews" > "${skip_reviews}.heads" || : > "${skip_reviews}.heads"
          fi
          # The head's own diff is fetched only when there is a head to match.
          head_patch=""
          if [ -s "${skip_reviews}.heads" ]; then
            head_patch="$(patch_id_of "$HEAD_SHA")" || head_patch=""
            [ -n "$head_patch" ] || echo "::notice::No patch id for ${HEAD_SHA}; reviewing it."
          fi
          if [ -n "$head_patch" ]; then
            while read -r seen url; do
              [ "$(patch_id_of "$seen")" = "$head_patch" ] || continue
              # Unlisted, a finding on them would be dropped unread: review.
              carried="$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/compare/${HEAD_SHA}...${seen}?per_page=100" \
                --jq '.commits[].sha' | paste -sd' ')" || break
              post_skip "Gatehouse skipped this review: the patch is unchanged since ${seen:0:7}, already reviewed (${url}). Its findings and their answers carry forward."$'\n\n''<!-- gatehouse review complete -->'$'\n'"<!-- gatehouse carried ${carried} -->"
              break
            done < "${skip_reviews}.heads"
          fi
          # --- end skips ---

          # A review that cannot run still posts one, marked failed, so the
          # triage check holds the PR open instead of passing on "no
          # findings" (#75, #77). The marker is github.py's REVIEW_FAILED_MARKER.
          fail_review() {
            echo "::error::Gatehouse could not review PR #${PR_NUMBER}: $1" >&2
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --silent \
              -f event=COMMENT -f commit_id="$HEAD_SHA" \
              -f body="Gatehouse could not review this PR: $1"$'\n\n''<!-- gatehouse review failed -->' \
              || echo "::warning::Could not post the failed review." >&2
            exit 2
          }
          [ -n "${OPENROUTER_API_KEY:-}" ] || fail_review "no OPENROUTER_API_KEY reached this run."

          # --- resolve image (tests/test_release_pins.py runs this) ---
          IMAGE="${IMAGE:-$LATEST_IMAGE}"
          echo "Reviewer image: ${IMAGE}"
          # --- end resolve image ---

          # Optional passthrough flags (only added when provided).
          # Advisory by default: unless the caller sets `blocking: true`, add
          # --advisory so gatehouse exits 0 regardless of findings. The review
          # is still posted; no finding fails the check.
          args=( --stdin --comment --required-low-agents "$REQUIRED_LOW_AGENTS" )
          [ "$BLOCKING" = "true" ] || args+=( --advisory )
          [ "$ACTION" = "synchronize" ] && args+=( --incremental )
          [ -n "$MODEL" ]  && args+=( --model "$MODEL" )
          [ -n "$AGENTS" ] && args+=( --agents "$AGENTS" )

          # 1) Fetch the PR diff over the API — data only, no fork code on disk.
          #    Staged in a file so a failed fetch fails here, by name, instead
          #    of reaching gatehouse as an empty diff. --allow-escape-sequences:
          #    gh otherwise refuses any diff containing ESC bytes (data files,
          #    terminal fixtures); the diff goes to a pipe, not a terminal, and
          #    gatehouse strips escapes from everything it prints or posts.
          diff_file="$(mktemp)"
          files_file="$(mktemp)"
          # Container root cannot write the runner's $GITHUB_STEP_SUMMARY
          # (EACCES, #61), so gatehouse writes into a scratch dir and the host
          # appends it after the run.
          out_dir="$(mktemp -d)"
          chmod 0777 "$out_dir"
          trap 'rm -rf "$diff_file" "$files_file" "$out_dir"' EXIT
          if ! gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --patch \
              --allow-escape-sequences > "$diff_file"; then
            # The diff endpoint refuses a PR of more than 300 files (HTTP 406,
            # #75). The files endpoint pages through up to 3000, each with its
            # own patch: still data only, still nothing checked out.
            echo "::warning::Could not fetch the PR diff; rebuilding it from the PR's file list."
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              > "$files_file" || fail_review "its diff could not be fetched."

            # --- files to diff (tests/test_files_diff.py runs this against fixtures) ---
            jq -rs '
              (add // [])[]
              | (.previous_filename // .filename) as $old
              | "diff --git a/\($old) b/\(.filename)",
                (if .status == "added" then "new file mode 100644"
                 elif .status == "removed" then "deleted file mode 100644"
                 elif .status == "renamed" then "rename from \($old)", "rename to \(.filename)"
                 else empty end),
                (select(.patch != null)
                 | (if .status == "added" then "--- /dev/null" else "--- a/\($old)" end),
                   (if .status == "removed" then "+++ /dev/null" else "+++ b/\(.filename)" end),
                   .patch)
            ' "$files_file" > "$diff_file" || fail_review "its diff could not be rebuilt."
            # --- end files to diff ---

            listed="$(jq -s 'add // [] | length' "$files_file")" \
              || fail_review "its file list could not be read."
            changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .changed_files)" \
              || fail_review "its file count could not be fetched."
            if [ "$listed" -lt "$changed" ]; then
              fail_review "it changes ${changed} files and the API lists only ${listed}."
            fi
            unpatched="$(jq -s '[(add // [])[] | select(.patch == null)] | length' "$files_file")" \
              || unpatched=0
            if [ "$unpatched" -gt 0 ]; then
              echo "::warning::${unpatched} file(s) carry no patch (binary, too large, or renamed unchanged) and were not reviewed."
            fi
          fi

          # 2) Feed it to the release-tag-pinned container's `gatehouse --stdin --comment`.
          #    - GITHUB_REF is synthesized as refs/pull/N/merge so gatehouse's
          #      detect_pr_context() resolves (repo, PR) without mounting the event file.
          #    - GITHUB_TOKEN authorizes gatehouse to POST the PR review via the REST API.
          #    - gatehouse appends its per-agent model/token/cost table to
          #      out_dir; the host copies it into the step summary.
          rc=0
          docker run --rm -i --pull always \
            -e OPENROUTER_API_KEY \
            -e GITHUB_TOKEN="$GH_TOKEN" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_REF="refs/pull/${PR_NUMBER}/merge" \
            -e GATEHOUSE_CONTEXT_REPO="$GITHUB_REPOSITORY" \
            -e GATEHOUSE_CONTEXT_REF="$BASE_REF" \
            -e GATEHOUSE_HEAD_SHA="$HEAD_SHA" \
            -e GATEHOUSE_HEAD_REPO="$HEAD_REPO" \
            -e GATEHOUSE_MAX_DIFF_BYTES="$MAX_DIFF_BYTES" \
            -v "$out_dir:/out" \
            -e GITHUB_STEP_SUMMARY=/out/step-summary.md \
            "$IMAGE" \
            "${args[@]}" < "$diff_file" || rc=$?
          if [ -s "$out_dir/step-summary.md" ]; then
            cat "$out_dir/step-summary.md" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::Could not append Gatehouse usage to the step summary."
          fi
          # 125-127 is docker failing to run the image, not gatehouse's verdict.
          if [ "$rc" -ge 125 ]; then
            fail_review "the reviewer image could not be run (exit ${rc})."
          fi
          exit "$rc"
