name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Every check this repo runs, from quay.io/crunchtools/sdlc through the
  # committed .sdlc/bin/sdlc -- the same image and commands `sdlc push` runs on a laptop, so a green
  # push predicts a green CI. Ruff, mypy, pytest, semgrep, pip-audit, the
  # constitution validator and CodeQL, plus the image build ([tool.sdlc.ci]).
  sdlc:
    name: sdlc ci
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: sdlc ci
        env:
          SDLC_IMAGE: ${{ vars.SDLC_IMAGE }}
        run: .sdlc/bin/sdlc ci

  # sdlc runs the suite on the image's Python (3.14). requires-python and the
  # classifiers promise 3.11 and 3.12, so each gets its own run.
  pytest-floor:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -v

  # Gatehouse code review runs in its own workflow (gatehouse.yml) on
  # pull_request_target, so it covers fork PRs too. See that file.

  # Call our own reusable workflow rather than inlining the job. Gatehouse
  # hosts gourmand.yml for the whole fleet; keeping a private copy here is the
  # copy-paste drift RT #1468 was filed about.
  gourmand-review:
    # Named like every fleet caller, so the check reports as the org ruleset's
    # required `Code Quality (Gourmand) / Code Quality (Gourmand)`.
    name: Code Quality (Gourmand)
    uses: ./.github/workflows/gourmand.yml

