name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Every check this repo runs, from python-sdlc at the .pre-commit-config.yaml
  # pin -- the same image and commands `sdlc push` runs on a laptop, so a green
  # push predicts a green CI. Ruff, mypy, pytest, semgrep, pip-audit, the
  # constitution validator and CodeQL, plus the image build ([tool.sdlc.ci]).
  sdlc:
    name: sdlc ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: sdlc ci
        run: |
          set -eu
          rev=$(awk '/repo: https:\/\/github.com\/crunchtools\/python-sdlc/ {f=1; next}
                     f && /rev:/ {print $2; exit}' .pre-commit-config.yaml)
          [ -n "$rev" ] || { echo "no python-sdlc rev in .pre-commit-config.yaml" >&2; exit 2; }
          git clone -q --depth 1 --branch "$rev" https://github.com/crunchtools/python-sdlc "$RUNNER_TEMP/sdlc"
          "$RUNNER_TEMP/sdlc/bin/sdlc" ci

  # sdlc runs the suite on the image's Python, the newest. requires-python
  # promises 3.11, so the floor keeps its own run.
  pytest-floor:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --python 3.11

      - name: Run tests
        run: uv run pytest -v

  # Gatehouse code review runs in its own workflow (gatehouse.yml) on
  # pull_request_target, so it covers fork PRs too. See that file.

  # Call our own reusable workflow rather than inlining the job. Gatehouse
  # hosts gourmand.yml for the whole fleet; keeping a private copy here is the
  # copy-paste drift RT #1468 was filed about.
  gourmand-review:
    # Named like every fleet caller, so the check reports as the org ruleset's
    # required `Code Quality (Gourmand) / Code Quality (Gourmand)`.
    name: Code Quality (Gourmand)
    uses: ./.github/workflows/gourmand.yml

