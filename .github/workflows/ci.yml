name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linter
        run: uv run ruff check src tests

      - name: Run type checker
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -v

  # Gatehouse code review runs in its own workflow (gatehouse.yml) on
  # pull_request_target, so it covers fork PRs too. See that file.

  # Call our own reusable workflow rather than inlining the job. Gatehouse
  # hosts gourmand.yml for the whole fleet; keeping a private copy here is the
  # copy-paste drift RT #1468 was filed about.
  gourmand-review:
    uses: ./.github/workflows/gourmand.yml
    with:
      # Pin our own gate to the previous image while the fleet migrates.
      #
      # This file calls gourmand.yml by path, not by tag, so it always runs
      # the workflow as it exists on this branch. v0.6.0 moves the default to
      # gourmand:1.0.0, which hard-errors on this repo's own un-migrated
      # config -- so publishing the new reusable workflow would break
      # gatehouse's CI before gatehouse itself has migrated.
      #
      # Overriding `image` here decouples the two: gatehouse ships v0.6.0 for
      # the fleet now, and migrates its own config in the normal Phase 3 sweep
      # (RT #1482), at which point this override is deleted.
      image: quay.io/crunchtools/gourmand:latest

  build-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f Containerfile -t gatehouse:test .

  validate-constitution:
    name: Constitution Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: crunchtools/constitution
          path: .constitution

      - name: Validate constitution
        run: python3 .constitution/validate-constitution.py .specify/memory/constitution.md --verbose
