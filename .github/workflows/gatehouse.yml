# Gatehouse dogfoods its own fork-safe review on EVERY PR — internal or external.
#
# This is the exact pattern shipped to adopters in examples/gatehouse.yml, except
# it references the reusable workflow locally (./.github/workflows/review.yml)
# instead of by tag. pull_request_target runs the trusted base-branch version of
# these files, so a PR can neither disable the guard nor tamper with the reviewer.

name: Gatehouse

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened]
  # Re-runs triage on a reply; guard and review are skipped for this event.
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}   # default-deny; each job grants only what it needs

jobs:
  # 1) Reject PRs from outside contributors that modify workflow files.
  guard:
    name: Protect workflows
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Reject workflow changes from untrusted PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # Gate on where the branch lives, not on the author's role. What
          # pull_request_target actually guards against is a fork PR reaching
          # repo secrets; a branch pushed into this repo already required write
          # access. author_association got that backwards in both directions --
          # it trusts a COLLABORATOR pushing from their own fork, and it
          # distrusts Dependabot (author_association NONE) whose branches are
          # ours, which failed every action-bump PR this repo ever got.
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "Head branch is in $GITHUB_REPOSITORY; allowing."; exit 0
          fi
          changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"
          if echo "$changed" | grep -qE '^\.github/workflows/'; then
            echo "::error::PR modifies .github/workflows/ — not accepted from external contributors."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
              $'🚫 **Workflow changes are not accepted via pull request.** Please open an issue and a maintainer will make the change.'
            exit 1
          fi
          echo "No workflow files changed."

  # 2) Review the PR diff (no checkout, BYO key) via the reusable workflow.
  review:
    name: Gatehouse review
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/review.yml
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # 3) Every finding answered (deterministic; safe as a required check).
  triage:
    name: Gatehouse triage
    needs: review
    if: always()
    permissions:
      pull-requests: read
    uses: ./.github/workflows/triage.yml
