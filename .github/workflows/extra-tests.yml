name: Extra tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
jobs:
  # sdlc runs the suite on the image's Python (3.14). requires-python and the
  # classifiers promise 3.11 and 3.12, so each gets its own run.
  pytest-floor:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -v
