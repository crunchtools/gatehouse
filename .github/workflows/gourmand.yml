# Gourmand — AI slop detection (reusable workflow)
#
# Runs the pinned Gourmand container against the caller repo. Centralizing
# the job body here means a fix or image change reaches every adopter on
# their next CI run instead of sitting frozen in a copy-pasted snapshot.
#
# Filed per RT #1468: a dead `cargo install --git codeberg.org/mattdm/gourmand`
# gate kept regenerating fleet-wide because the old `examples/gourmand.yml`
# was a copy-paste snippet, not a `workflow_call` reference — fixing it in one
# repo never propagated to the repos that had already copied it. Do not go
# back to a copy-paste example; that is the exact bug this workflow fixes.
#
# ── How adopters use it ──────────────────────────────────────────────────────
# Add this job to your CI workflow:
#
#   jobs:
#     gourmand:
#       name: Code Quality (Gourmand)
#       uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0
#
# ── Migrating from v0.5.0 ────────────────────────────────────────────────────
# v0.6.0 moves to Gourmand 1.0.0 (upstream v0.16.5) and is BREAKING. Bumping
# the ref alone is not enough; the caller repo's config must change in the
# same commit, because the old and new configs are mutually incompatible.
# Per repo (RT #1482):
#
#   1. Delete the [thresholds] block from gourmand.toml. Upstream hard-errors
#      on the old field names (20 were renamed in v0.14.x). The block was only
#      ever a workaround for a v0.1.0 bug that zeroed every threshold when the
#      table was absent; that bug is fixed, so deleting restores the defaults.
#   2. Add a `classification` to every [[exceptions]] entry: gourmand_bug,
#      by_design, accepted_bad_taste or fix_planned. Required at runtime.
#   3. Add a [[check_overrides]] entry, with classification, for every check
#      disabled in [checks].
#
# Repos still on an older tag of this file keep resolving the default they
# pinned and stay green, so the fleet migrates one repo at a time rather than
# all at once. That is also why `crunchtools/gourmand` itself still publishes
# `:latest` from main: flipping it before every repo has moved to a tag
# carrying the `:main` default would freeze those repos' gate at v1.0.0.

name: Gourmand (reusable)

on:
  workflow_call:
    inputs:
      path:
        description: "Path to scan (default: repo root)"
        type: string
        required: false
        default: "."
      image:
        description: "Gourmand image ref. Override to pin a specific digest/tag."
        type: string
        required: false
        # `:main`, not `:latest`. Constitution 1.33.0 makes `latest` the newest
        # RELEASE, and Gourmand has exactly one tag, v1.0.0, with main far past
        # it -- so `:latest` would hold this gate at v1.0.0 for every repo that
        # calls this workflow. RT #1482 already caused that break once from the
        # other direction, when tagging v1.0.0 moved `:latest` backwards and the
        # Code Quality gate failed fleet-wide. `:main` is what the gate has
        # actually tracked since; it now says so.
        default: "quay.io/crunchtools/gourmand:main"

jobs:
  gourmand:
    name: Code Quality (Gourmand)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Gourmand
        run: gourmand check --full ${{ inputs.path }}
