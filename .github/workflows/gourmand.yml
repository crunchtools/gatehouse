# Gourmand — AI slop detection (reusable workflow)
#
# Runs the pinned Gourmand container against the caller repo. Centralizing
# the job body here means a fix or image change reaches every adopter on
# their next CI run instead of sitting frozen in a copy-pasted snapshot.
#
# Filed per RT #1468: a dead `cargo install --git codeberg.org/mattdm/gourmand`
# gate kept regenerating fleet-wide because the old `examples/gourmand.yml`
# was a copy-paste snippet, not a `workflow_call` reference — fixing it in one
# repo never propagated to the repos that had already copied it. Do not go
# back to a copy-paste example; that is the exact bug this workflow fixes.
#
# ── How adopters use it ──────────────────────────────────────────────────────
# Add this job to your CI workflow:
#
#   jobs:
#     gourmand:
#       name: Code Quality (Gourmand)
#       uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0
#
# ── Plaintext secrets ────────────────────────────────────────────────────────
# Before Gourmand runs, the job refuses any added line that carries a known
# credential shape (Google, Anthropic, OpenRouter, GitHub, GitLab, AWS, Slack
# keys and bare JWTs), crunchtools/trentina#769, or that gives a secret-named
# key a literal (a475): a fallback on a secret env read (`|| 'x'`, `?? 'x'`,
# `${X:-x}`, `getenv("X", "x")`), a quoted value (`password: 'x'`), or an
# unquoted one in env, compose, yaml and conf files (`PGPASSWORD=x`). A named
# literal in a test path is a warning, not a refusal, because fixtures are
# full of fake tokens; a fallback is refused there too, since that is how a
# dev password reaches production. Placeholders (`changeme`, `<...>`, `${...}`,
# `example`) pass. A fixture marks its line `gatehouse: allow-secret`.
# `secret_scan: false` turns it off for one caller; it is an emergency switch,
# not a setting.
#
# ── Migrating from v0.5.0 ────────────────────────────────────────────────────
# v0.6.0 moves to Gourmand 1.0.0 (upstream v0.16.5) and is BREAKING. Bumping
# the ref alone is not enough; the caller repo's config must change in the
# same commit, because the old and new configs are mutually incompatible.
# Per repo (RT #1482):
#
#   1. Delete the [thresholds] block from gourmand.toml. Upstream hard-errors
#      on the old field names (20 were renamed in v0.14.x). The block was only
#      ever a workaround for a v0.1.0 bug that zeroed every threshold when the
#      table was absent; that bug is fixed, so deleting restores the defaults.
#   2. Add a `classification` to every [[exceptions]] entry: gourmand_bug,
#      by_design, accepted_bad_taste or fix_planned. Required at runtime.
#   3. Add a [[check_overrides]] entry, with classification, for every check
#      disabled in [checks].
#
# Repos still on an older tag of this file keep resolving the default they
# pinned and stay green, so the fleet migrates one repo at a time rather than
# all at once. That is also why `crunchtools/gourmand` itself still publishes
# `:latest` from main: flipping it before every repo has moved to a tag
# carrying the `:main` default would freeze those repos' gate at v1.0.0.

name: Gourmand (reusable)

on:
  workflow_call:
    inputs:
      path:
        description: "Path to scan (default: repo root)"
        type: string
        required: false
        default: "."
      image:
        description: "Gourmand image ref. Override to pin a specific digest/tag."
        type: string
        required: false
        # `:main`, not `:latest`. Constitution 1.33.0 makes `latest` the newest
        # RELEASE, and Gourmand has exactly one tag, v1.0.0, with main far past
        # it -- so `:latest` would hold this gate at v1.0.0 for every repo that
        # calls this workflow. RT #1482 already caused that break once from the
        # other direction, when tagging v1.0.0 moved `:latest` backwards and the
        # Code Quality gate failed fleet-wide. `:main` is what the gate has
        # actually tracked since; it now says so.
        default: "quay.io/crunchtools/gourmand:main"
      secret_scan:
        description: "Refuse added lines carrying a plaintext secret. Emergency off switch only."
        type: boolean
        required: false
        default: true

jobs:
  gourmand:
    name: Code Quality (Gourmand)
    # Our own runners when the organization names them (crunchtools/trentina's
    # security.yml is the model): the CALLER's same-repository pull request on
    # CACHED_RUNNER_LABEL, its push, schedule, manual run, release or merge
    # queue on UNCACHED_RUNNER_LABEL. In a reusable workflow the event is the
    # caller's, so the uncached side is a list, not "anything but a pull
    # request": a fork's or Dependabot's pull request, a Dependabot branch, and
    # pull_request_target, comment or workflow_run callers stay on GitHub's
    # machines. Clearing a variable sends its jobs back with no commit: the kill
    # switch. The job container runs through crunchtools/gha-runner's docker shim.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (vars.CACHED_RUNNER_LABEL || 'ubuntu-latest')
          || contains(fromJSON('["push","schedule","workflow_dispatch","release","merge_group"]'), github.event_name)
          && !startsWith(github.ref, 'refs/heads/dependabot/')
          && (vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || 'ubuntu-latest' }}
    container:
      image: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7
      # Refuse a change that adds a plaintext secret (crunchtools/trentina#769).
      # It lives in this job, not a repo's own CI, because every Crunchtools
      # repo already calls this workflow at @v0 and this job is the org-required
      # check: a rule here reaches all of them, and any repo scaffolded later,
      # without a pin bump. Only ADDED lines are read, against the PR base or
      # the push's previous tip, and a hit names file, line and key, never the
      # value. A fixture line carrying `gatehouse: allow-secret` is skipped.
      # tests/test_secret_scan.py runs this script against a scratch repo.
      - name: Refuse plaintext secrets
        if: ${{ inputs.secret_scan }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The side to scan. pull_request checks out the merge commit, so HEAD.
          # pull_request_target checks out the BASE branch, so the PR's own
          # commits are fetched by ref and only diffed, never checked out or run.
          TARGET=HEAD
          case "$EVENT" in
            pull_request) BASE=$PR_BASE ;;
            pull_request_target)
              BASE=$PR_BASE
              git fetch --no-tags --depth=1 origin "refs/pull/$PR_NUMBER/head"
              TARGET=$(git rev-parse FETCH_HEAD) ;;
            push) BASE=$BEFORE ;;
            *) echo "No base commit for a $EVENT run; nothing to compare."; exit 0 ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
            BASE=$(git rev-parse FETCH_HEAD)
          else
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          set -eu
          hits=0
          warns=0
          shapes='AIza[0-9A-Za-z_-]{35}|sk-ant-[A-Za-z0-9_-]{20,}|sk-or-v1-[0-9a-f]{32,}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,}|glpat-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
          # Secret-named keys given a literal (a475). Bracket escapes only, so
          # GNU, BSD and busybox grep read them alike. ENV is an environment
          # variable's name, KEY the same word as code spells it.
          Q="[\"']"
          ENV='(PASSWORD|PASSWD|PASSPHRASE|SECRET|TOKEN|API_?KEY)'
          KEY='([Pp]ass(word|wd|phrase)|PASS(WORD|WD|PHRASE)|[Ss]ecret|SECRET|[Tt]oken|TOKEN|[Aa]pi[_-]?[Kk]ey|API_?KEY|([Pp]rivate|[Aa]ccess)[_-]?[Kk]ey|(PRIVATE|ACCESS)_KEY)'
          # A secret env read with a literal default: `|| 'x'`, `?? 'x'`, `or 'x'`,
          # `${X:-x}`, `getenv("X", "x")`. Refused even as a placeholder: the
          # default is what runs when the variable is unset.
          fallback="${ENV}[]\"')]*[[:space:]]*([|][|]|[?][?]|[[:space:]]or)[[:space:]]*${Q}[^\"']{3,}${Q}|[\$][{][A-Z0-9_]*${ENV}:?-[^}\$]{3,}[}]|(getenv|environ[.]get|env[.]get)[(]${Q}[A-Z0-9_]*${ENV}${Q},[[:space:]]*${Q}[^\"']{3,}${Q}"
          # A secret-named key given a quoted literal: `password: 'x'`, `token = "x"`.
          assign="[A-Za-z0-9_.-]*${KEY}${Q}?[[:space:]]*(:|=|:=|=>)[[:space:]]*${Q}[^\"'[:space:]]{3,}${Q}"
          # In env, compose, yaml and conf files: `PGPASSWORD=x`, `- SECRET: "x"`.
          envline="^[[:space:]]*(-[[:space:]]+)?(export[[:space:]]+)?[A-Z0-9_]*${ENV}[[:space:]]*[=:][[:space:]]*${Q}?[^\"'[:space:]\$<{#|>&][^\"'[:space:]]{2,}"
          # A default that is only a switch: `getenv("REQUIRE_PASSPHRASE", "yes")`.
          switch="${Q}(yes|no|true|false|none|null|on|off)${Q}\$"
          # Values that hold no secret: placeholders, references (`"$X"`, `${X}`),
          # CI fakes (`test_token_for_ci`), masks, and a field's own name
          # (`STATIC_TOKEN = "static_token"`).
          placeholder="change[_-]?(me|this)|example|placeholder|<[^>]*>|${Q}[\$]|[\$][{]|[{][{]|%[(]|xxx|your[_-]|dummy|fake|${Q}test[_-]|for[_-]ci|redacted|[*][*][*]|••|replace[_-]?me|[.][.][.]|${Q}[a-z]+_[a-z_]*(pass(word|wd|phrase)|secret|token|key)${Q}\$|${Q}(yes|no|true|false|none|null|on|off)${Q}\$|[=:][[:space:]]*(yes|no|true|false|none|null|on|off)\$"
          tests='(^|/)(tests?|__tests__|spec|fixtures?|testdata)/|(^|/)test_[^/]*$|_test[.][a-z]+$|[.](test|spec)[.][jt]sx?$|(^|/)conftest[.]py$'
          configs='(^|/)([.]env[^/]*|[^/]*[.](env|ya?ml|conf|cfg|ini|properties|container|service|sh)|Containerfile[^/]*|Dockerfile[^/]*|docker-compose[^/]*|compose[^/]*)$'
          diff_file=$(mktemp)
          cand_file=$(mktemp)
          git diff --unified=0 --no-color --no-ext-diff "$BASE" "$TARGET" > "$diff_file"
          # One pass picks the candidates: the number of every diff line that
          # adds a match. Other lines are blanked, not dropped, so the numbers
          # stay the diff's. The common case, none, ends here, and the walk
          # below spawns nothing for a line that is not a candidate, so a large
          # change costs one grep, not a few processes per line. No awk: the
          # Gourmand image has none.
          sed -e 's/^+++ .*//' -e 's/^+//' -e t -e 's/.*//' "$diff_file" \
            | grep -nE -e "$shapes" -e "$fallback" -e "$assign" -e "$envline" \
            | cut -d: -f1 > "$cand_file" || true
          if [ ! -s "$cand_file" ]; then
            rm -f "$diff_file" "$cand_file"
            echo "No plaintext secrets in the added lines."
            exit 0
          fi
          exec 3< "$cand_file"
          read -r want <&3 || want=0
          file=""
          line=0
          row_no=0
          while IFS= read -r row; do
            row_no=$((row_no + 1))
            case "$row" in
              '+++ b/'*) file=${row#+++ b/}; continue ;;
              '+++ '*) file=""; continue ;;
              '@@ '*)
                # `@@ -a,b +c,d @@`: the new side starts at c.
                start=${row#*+}
                start=${start%% *}
                line=${start%%,*}
                continue ;;
              '+'*) ;;
              *) continue ;;
            esac
            added=${row#+}
            at=$line
            line=$((line + 1))
            [ "$row_no" -eq "$want" ] || continue
            read -r want <&3 || want=0
            [ -n "$file" ] || continue
            case "$added" in *'gatehouse: allow-secret'*) continue ;; esac
            verdict=""
            if printf '%s\n' "$added" | grep -Eq -e "$shapes"; then
              verdict=refuse
            elif printf '%s\n' "$added" | grep -oE -e "$fallback" | grep -vEq "$switch"; then
              verdict=refuse
            else
              named=$(printf '%s\n' "$added" | grep -oE -e "$assign" || true)
              if printf '%s\n' "$file" | grep -Eq "$configs"; then
                named="${named}$(printf '\n%s\n' "$added" | grep -oE -e "$envline" || true)"
              fi
              if [ -n "$named" ] && printf '%s\n' "$named" | grep -v '^$' | grep -viEq "$placeholder"; then
                if printf '%s\n' "$file" | grep -Eq "$tests"; then verdict=warn; else verdict=refuse; fi
              fi
            fi
            [ -n "$verdict" ] || continue
            name=$(printf '%s\n' "$added" | sed -n -E 's/^[[:space:]]*(-[[:space:]]+)?(export[[:space:]]+)?"?([A-Za-z_][A-Za-z0-9_.-]*)"?[[:space:]]*[:=].*/\3/p')
            if [ "$verdict" = refuse ]; then
              echo "::error file=${file},line=${at}::plaintext secret in ${name:-(unnamed value)}"
              hits=$((hits + 1))
            else
              echo "::warning file=${file},line=${at}::literal secret in test ${name:-(unnamed value)}; mark it 'gatehouse: allow-secret' if it is a fixture"
              warns=$((warns + 1))
            fi
          done < "$diff_file"
          exec 3<&-
          rm -f "$diff_file" "$cand_file"
          if [ "$hits" -gt 0 ]; then
            echo "Refusing ${hits} plaintext secret(s). Move each to a *_FILE path or the host's encrypted store; mark a test fixture line 'gatehouse: allow-secret'."
            exit 1
          fi
          if [ "$warns" -gt 0 ]; then
            echo "${warns} literal secret(s) in test files, warned only."
          fi
          echo "No plaintext secrets in the added lines."
      - name: Run Gourmand
        run: gourmand check --full ${{ inputs.path }}
