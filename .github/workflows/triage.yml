# Gatehouse triage — every required finding gets an answer before merge (reusable)
#
# The review job is advisory: an LLM reviewer is non-deterministic, so it never
# holds merge authority. That left a gap nobody measured — findings were posted
# and then merged past, unanswered. On one repo a PR drew 40 findings (21 high)
# and merged five minutes later with no reply to any of them.
#
# This job closes the gap without giving the LLM a vote. It does not judge the
# findings. It checks that a HUMAN (or an agent acting for one) replied to each
# one — `fixed in <sha>` or `not a bug: <reason>`. That is deterministic, so
# unlike the review it is safe to mark as a required status check.
#
# What counts:
#   • a finding  = an inline PR review comment by the reviewer account that is
#                  not itself a reply (findings without a file/line are posted
#                  only in the review summary and are not counted here)
#   • an answer  = any reply in that thread by someone other than the reviewer
#   • required   = CRITICAL, HIGH and MEDIUM from any agent, and LOW only from
#                  the agents in `required_low_agents`. Other LOWs still post,
#                  but as advisory: most were noise, and each one answered
#                  cost a fix-push-review round (#56).
#   • a review that did not finish = the newest review by the reviewer account
#                  is marked failed (fewer than half its agents finished, or
#                  the reviewer could not run). That fails this job too: no
#                  findings because nothing was looked at is not a pass (#77).
# Outdated findings still count: a later commit fixing one is answered by
# saying so, which is the audit trail this job exists to create.
#
# Callers run it after the review job, in the same pull_request_target run
# (see examples/gatehouse.yml). A reply cannot simply run it again: a review
# posted with GITHUB_TOKEN starts no workflow, and a run started by the reply
# event does not count toward branch rules. retriage.yml re-runs this job
# inside the pull_request_target run instead.
#
# Read-only: pull-requests: read, no checkout, no secrets, no PR code executed.

name: Gatehouse triage

on:
  workflow_call:
    inputs:
      reviewer:
        description: "Account that posts Gatehouse findings."
        type: string
        required: false
        default: "github-actions[bot]"
      required_low_agents:
        # Pass the same list to review.yml, whose advisory LOW cap exempts it.
        description: "Comma-separated agent names whose LOW findings need an answer."
        type: string
        required: false
        default: "Bug Hunter,Security Scan"

permissions: {}

jobs:
  triage:
    name: Gatehouse triage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Every Gatehouse finding has a reply
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ inputs.reviewer }}
          REQUIRED_LOW_AGENTS: ${{ inputs.required_low_agents }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::No pull_request context." >&2
            exit 1
          fi

          # A review that did not happen has no findings to answer, and is not
          # a clean one (#77). The newest Gatehouse review decides, so
          # re-running the review job is what clears it.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > reviews.json

          # --- review gate (tests/test_triage.py runs this against fixtures) ---
          jq -rs --arg bot "$REVIEWER" '
            [ (add // [])[]
              | select(.user.login == $bot and ((.body // "") | startswith("Gatehouse"))) ]
            | last
            | select(. != null and (.body | contains("<!-- gatehouse review failed -->")))
            | .html_url
          ' reviews.json > failed_review.txt
          # --- end review gate ---

          if [ -s failed_review.txt ]; then
            {
              echo "## The last Gatehouse review did not finish"
              echo
              echo "Nothing was reviewed: $(cat failed_review.txt)"
              echo
              echo "Fix the cause it names, then re-run the review job."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The last Gatehouse review did not finish: $(cat failed_review.txt)"
            exit 1
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" \
            > comments.json

          # --- triage filter (tests/test_triage.py runs this against fixtures) ---
          jq -s --arg bot "$REVIEWER" --arg required_low "$REQUIRED_LOW_AGENTS" '
            (add // []) as $all
            | ($required_low | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $low_agents
            | (reduce ($all[] | select(.in_reply_to_id != null and .user.login != $bot)
                | .in_reply_to_id) as $r ({}; .[$r | tostring] = true)) as $answered
            | [ $all[]
                | select(.user.login == $bot and .in_reply_to_id == null)
                | select($answered[.id | tostring] | not)
                | (.body | split("\n")[0]) as $head
                | select(($head | startswith("**LOW** (") | not)
                    or any($low_agents[]; . as $a | $head | startswith("**LOW** (\($a)):")))
                | { url: .html_url,
                    path: .path,
                    line: (.line // .original_line),
                    finding: (.body | split("\n")[0]) } ]
          ' comments.json > unanswered.json
          # --- end triage filter ---

          count=$(jq length unanswered.json)
          if [ "$count" -eq 0 ]; then
            echo "Every Gatehouse finding on this PR has a reply."
            exit 0
          fi

          {
            echo "## ${count} unanswered Gatehouse finding(s)"
            echo
            echo 'Reply to each thread with `fixed in <sha>` or `not a bug: <reason>`.'
            echo
            jq -r '.[] | "- [\(.path):\(.line)](\(.url)) \(.finding)"' unanswered.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "::error file=\(.path),line=\(.line)::Unanswered Gatehouse finding: \(.url)"' \
            unanswered.json
          exit 1
