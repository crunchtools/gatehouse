[[exceptions]]
check = "summary_litter"
path = "CLAUDE.md"
justification = "Claude Code project instructions for AI assistant orientation"

[[exceptions]]
check = "redundant_error_handling"
path = "src/gatehouse/github.py"
justification = "Parsing untrusted JSON from GITHUB_EVENT_PATH — must catch OSError/JSONDecodeError and fall through to return None"

[[exceptions]]
check = "single_use_helpers"
path = "src/gatehouse/diffview.py"
justification = "Helpers extracted from _parse_diff/render_diff_view to satisfy ruff C901/PLR0912/PLR0915 complexity limits — inlining them re-violates ruff"

[[exceptions]]
check = "prefer_match"
path = "src/gatehouse/diffview.py"
justification = "Chains dispatch on str.startswith prefixes; Python match has no prefix patterns, so every case would need a guard clause — less readable than elif"

[[exceptions]]
check = "over_abstraction"
path = "src/gatehouse/output.py"
justification = "strip_ansi wraps a single _ANSI_RE.sub() call. The name is the documentation — it marks the call sites where untrusted text is being sanitised, which a bare regex substitution would not."

[[exceptions]]
check = "copy_paste_detection"
path = "src/gatehouse/agents.py"
justification = "build_user_prompt and build_constitution_prompt assemble different prompts from different inputs; they share only the three-line join-and-return shape, which is also what makes them look like diffview._render_hunk."
