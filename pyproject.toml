[project]
name = "gatehouse-crunchtools"
version = "0.34.0"
description = "Local AI code review CLI using concurrent LLM agents"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["code-review", "ai", "openrouter", "linter", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
gatehouse = "gatehouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatehouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = [
    "S101",     # assert allowed in tests
    "TRY003",   # long exception messages ok
    "PLR2004",  # magic numbers ok
    "S603",     # subprocess call ok (we call git)
    "S607",     # partial executable path ok (git)
    "PLR0913",  # many arguments ok for orchestration functions
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLC0415", "PLR2004"]
"src/gatehouse/llm.py" = ["S311"]  # random.random for backoff jitter, not crypto

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Checks run from python-sdlc at the .pre-commit-config.yaml pin; `sdlc tiers`
# prints what each command runs. The defaults cover what ci.yml ran by hand
# (ruff, mypy, pytest) and add pip-audit, constitution and CodeQL.
#
# No semgrep: there is no .semgrep rule set in this repo.
[tool.sdlc.push]
skip = ["semgrep"]
#
# The image is built here, as ci.yml's build job did.
[tool.sdlc.ci]
checks = ["image", "py311", "py312"]

[tool.sdlc.ci.image]
kind = "image-build"

# The entrypoint is a CLI, not a server: --help proves the venv, the entrypoint
# and every import load, with no API key and no repo mounted. A hard gate: it is
# the boot check container.yml enforced, and sdlc's image job runs no
# `boot = "command"`.
[tool.sdlc.ci.container-smoke]
args = ["--help"]
gate = true

# pytest runs on the gate image's Python (3.14); requires-python and the
# classifiers promise 3.11 and 3.12, so each gets its own run.
[tool.sdlc.ci.py311]
kind = "command"
image = "ghcr.io/astral-sh/uv:0.13.7-python3.11-trixie@sha256:be23e58d8bebb2a6dc1e4a600173fa6e1c6ad7717519df728c1f62ad0544ca64"
argv = ["uv", "run", "--locked", "--all-extras", "pytest", "-q", "-p", "no:cacheprovider"]
env = { UV_PROJECT_ENVIRONMENT = "/tmp/venv", UV_PYTHON_DOWNLOADS = "never" }
network = true

[tool.sdlc.ci.py312]
kind = "command"
image = "ghcr.io/astral-sh/uv:0.13.7-python3.12-trixie@sha256:2cd2db9a96f7036629ff5427e2769030dd1314bb6522a2e0999bad3f45e1dc9e"
argv = ["uv", "run", "--locked", "--all-extras", "pytest", "-q", "-p", "no:cacheprovider"]
env = { UV_PROJECT_ENVIRONMENT = "/tmp/venv", UV_PYTHON_DOWNLOADS = "never" }
network = true

[tool.sdlc]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
publish = "pypi"
repo-kinds = ["cli-tool"]
# The release image is built by the `image` job, which plans the container build.
stacks = ["container"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/gatehouse"
boot = "none"
boot-none-reason = "a CLI, not a server: [tool.sdlc.ci.container-smoke] gates its --help in sdlc ci"
