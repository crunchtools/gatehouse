# Findings already judged, so a review stops raising them. Gatehouse only ever
# reads this file: it prints an entry to paste when it reports a finding, and
# whoever judged the finding fills in the reason and commits it.
#
# status is "not-a-bug" or "deferred". A deferred entry's reason must link the
# issue tracking it. There is no "fixed": an entry stops applying by itself
# once the code it quotes is gone, and gatehouse then prints it as stale.
#
# An entry added on a branch is posted on its pull request as a finding a
# maintainer has to answer, because silencing the gate is not a quiet change.
#
# [[findings]]
# agent = "bugs"
# category = "bug"
# file = "src/example.py"
# evidence = "total = total / count"
# status = "not-a-bug"
# reason = "count is validated non-zero by the only caller, see guard above"

[[findings]]
agent = "security"
category = "security"
file = ".github/workflows/triage.yml"
evidence = "| .body | scan(\"<!-- gatehouse carried ([0-9a-f ]*) -->\") | .[0]"
status = "not-a-bug"
reason = "An answer only closes its own thread. A bug reintroduced by a later change is raised as a new finding by that change's review, which no old answer touches; the same holds on a PR that was never rebased."

[[findings]]
agent = "constitution"
category = "constitution"
file = ".github/workflows/triage.yml"
evidence = "cat pr_shas.txt carried_shas.txt | jq -R . | jq -s . > shas.json"
status = "deferred"
reason = "Carrying a skipped rebase's commits is the a155 design; constitution XII's orphan rule needs the amendment in https://github.com/crunchtools/constitution/issues/143"
